<script>
  // on pose la classe dark avant le premier rendu, sinon ça flashe en clair

    try {
      var s = JSON.parse(localStorage.getItem("youss-state-v2") || "null");
      if (s && s.prefs && s.prefs.theme === "dark") document.documentElement.classList.add("dark");
      if (localStorage.getItem("yc-lang") === "en") document.documentElement.lang = "en";
    } catch (e) {}
  })();
</script>

<script>
  (function () {
    function ready() { document.documentElement.classList.add("fonts-ready"); }
    if (document.fonts && document.fonts.load) {
      Promise.all([document.fonts.load("20px 'Material Symbols Outlined'"), document.fonts.ready]).then(ready, ready);
    } else { ready(); }
    setTimeout(ready, 1500);
  })();
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", function () { navigator.serviceWorker.register("./sw.js").catch(function () {}); });
