<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>YOUSS CONNECT — Une seule application pour vivre l'Afrique au quotidien</title>
<meta name="description" content="YOUSS CONNECT, la super application africaine portée par KYA CORPORATION : transport, livraison, restaurants, événements, Youss Market, culture et tourisme, Youss Wallet, Youss Bonus et Youss Business."/>
<link rel="manifest" href="./manifest.webmanifest"/>
<link rel="icon" href="./icons/favicon.ico" sizes="any"/>
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png"/>
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"/>
<meta name="theme-color" content="#FAFAFA"/>
<meta name="color-scheme" content="light dark"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="YOUSS CONNECT"/>
<meta property="og:title" content="YOUSS CONNECT"/>
<meta property="og:description" content="Une seule application pour vivre l'Afrique au quotidien. Portée par KYA CORPORATION."/>
<meta property="og:image" content="./assets/img/brand/og-cover.jpg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&display=block" rel="stylesheet"/>
<link rel="stylesheet" href="./vendor/leaflet/leaflet.css"/>
<link rel="stylesheet" href="./css/app.css"/>
<script>
  /* Thème appliqué avant le premier rendu pour éviter un flash */
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem("youss-state-v2") || "null");
      if (s && s.prefs && s.prefs.theme === "dark") document.documentElement.classList.add("dark");
    } catch (e) {}
  })();
</script>
</head>
<body>
<div id="app" class="min-h-dvh"></div>
<noscript><div style="padding:2rem;text-align:center;font-family:system-ui">YOUSS CONNECT nécessite JavaScript.</div></noscript>

<script src="./vendor/leaflet/leaflet.js" defer></script>
<script src="./js/config.js"></script>
<script src="./js/i18n.js"></script>
<script src="./js/data.js"></script>
<script src="./js/state.js"></script>
<script src="./js/backend.js"></script>

<script src="./js/scanner.js"></script>

<script src="./js/demo.js"></script>
<script src="./js/shell.js"></script>
<script src="./js/screens/auth.js"></script>
<script src="./js/screens/home.js"></script>
<script src="./js/screens/explorer.js"></script>
<script src="./js/screens/transport.js"></script>
<script src="./js/screens/delivery.js"></script>
<script src="./js/screens/restaurants.js"></script>
<script src="./js/screens/orders.js"></script>
<script src="./js/screens/events.js"></script>
<script src="./js/screens/market.js"></script>
<script src="./js/screens/culture.js"></script>
<script src="./js/screens/wallet.js"></script>
<script src="./js/screens/rewards.js"></script>
<script src="./js/screens/business.js"></script>
<script src="./js/screens/activities.js"></script>
<script src="./js/screens/notifications.js"></script>
<script src="./js/screens/profile.js"></script>
<script src="./js/router.js"></script>
<script>
  (function () {
    function ready() { document.documentElement.classList.add("fonts-ready"); }
    if (document.fonts && document.fonts.load) {
      Promise.all([document.fonts.load("20px 'Material Symbols Outlined'"), document.fonts.ready]).then(ready, ready);
    } else { ready(); }
    setTimeout(ready, 1500);
  })();
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", function () { navigator.serviceWorker.register("./sw.js").catch(function () {}); });
  }
</script>
</body>
</html>
